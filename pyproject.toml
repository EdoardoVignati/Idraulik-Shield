[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idraulik-shield"
version = "0.1.0"
description = "Plug-and-play AI sysadmin daemon for Debian-based servers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
idraulik = "idraulik.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
